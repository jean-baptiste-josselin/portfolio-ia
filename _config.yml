  - scope:
      path: "projets/n8n-reception-demandes"
    values:
      image: /projets/n8n-reception-demandes/workflow.png
      description: "Un workflow n8n qui prévient le bon service à chaque nouvelle demande, fait proposer une catégorie par une IA sous contrôle et trace chaque traitement."
