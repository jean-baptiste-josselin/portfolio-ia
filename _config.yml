# Réglages du site GitHub Pages (aperçus LinkedIn et moteurs de recherche)
lang: fr
locale: fr_FR
description: "Portfolio de Jean-Baptiste Josselin : projets d'automatisation et d'applications web pour petites structures, avec besoins métier, résultats et limites."

defaults:
